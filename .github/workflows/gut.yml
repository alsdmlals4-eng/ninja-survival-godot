name: GUT

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gut:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          rm -f godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64
          ./Godot_v4.7.1-stable_linux.x86_64 --version

      - name: Prepare GUT 9.7.1 for CI
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f addons/gut/plugin.cfg ]]; then
            echo "Using repository-vendored GUT."
            grep -q 'version="9.7.1"' addons/gut/plugin.cfg
            test -f addons/gut/gut_cmdln.gd
            test ! -d addons/gut/gut
          else
            echo "GUT is not vendored on this revision; installing the pinned CI copy."
            test ! -e addons/gut
            curl -L --fail -o gut.zip https://github.com/bitwes/Gut/archive/refs/tags/v9.7.1.zip
            unzip -q gut.zip
            mkdir -p addons
            cp -R Gut-9.7.1/addons/gut addons/gut
            rm -rf Gut-9.7.1 gut.zip
          fi

      - name: Import project
        shell: bash
        run: |
          set -euo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path . --import 2>&1 | tee import-output.log
          if grep -F "UID duplicate detected" import-output.log; then
            echo "Godot UID duplicate detected during project import."
            exit 1
          fi

      - name: Smoke test main scene
        shell: bash
        run: |
          set -euo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path . --scene res://scenes/main/main_scene.tscn --quit-after 120 2>&1 | tee smoke-output.log
          if grep -E "SCRIPT ERROR:|ERROR:" smoke-output.log; then
            exit 1
          fi

      - name: Run GUT
        shell: bash
        run: |
          set -euo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path . -s addons/gut/gut_cmdln.gd -gdir=res://tests -ginclude_subdirs -gexit 2>&1 | tee gut-output.log
          if grep -E "SCRIPT ERROR:|ERROR:" gut-output.log; then
            exit 1
          fi
          grep -q "test_script_contracts.gd" gut-output.log
