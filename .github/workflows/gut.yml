name: GUT

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gut:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Base reuse adoption manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          expected = {
              "schema_version": 1,
              "base_source_commit": "8553678f70e22f193a2336b591f677dcfa5a8965",
              "modules": {
                  "RM-TOOL-001": {"state": "planned"},
                  "RM-SYS-001": {"state": "planned"},
                  "RM-SYS-003": {"state": "planned"},
                  "RM-VIS-001": {"state": "planned"},
                  "RM-VIS-002": {"state": "planned"},
              },
          }
          path = Path("docs/base-reuse-adoption.json")
          actual = json.loads(path.read_text(encoding="utf-8"))
          if actual != expected:
              raise SystemExit(f"Base reuse adoption manifest mismatch: {actual!r}")
          print("Base reuse adoption manifest PASS")
          PY

      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          rm -f godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64
          ./Godot_v4.7.1-stable_linux.x86_64 --version

      - name: Prepare GUT 9.7.1 for CI
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f addons/gut/plugin.cfg ]]; then
            echo "Using repository-vendored GUT."
            grep -q 'version="9.7.1"' addons/gut/plugin.cfg
            test -f addons/gut/gut_cmdln.gd
            test ! -d addons/gut/gut
          else
            echo "GUT is not vendored on this revision; installing the pinned CI copy."
            test ! -e addons/gut
            curl -L --fail -o gut.zip https://github.com/bitwes/Gut/archive/refs/tags/v9.7.1.zip
            unzip -q gut.zip
            mkdir -p addons
            cp -R Gut-9.7.1/addons/gut addons/gut
            rm -rf Gut-9.7.1 gut.zip
          fi

      - name: Import project
        shell: bash
        run: |
          set -euo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path . --import 2>&1 | tee import-output.log
          if grep -F "UID duplicate detected" import-output.log; then
            echo "Godot UID duplicate detected during project import."
            exit 1
          fi

      - name: Smoke test main scene
        shell: bash
        run: |
          set -euo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path . --scene res://scenes/main/main_scene.tscn --quit-after 120 2>&1 | tee smoke-output.log
          if grep -E "SCRIPT ERROR:|ERROR:" smoke-output.log; then
            exit 1
          fi

      - name: Run GUT
        shell: bash
        run: |
          set -euo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path . -s addons/gut/gut_cmdln.gd -gdir=res://tests -ginclude_subdirs -gexit 2>&1 | tee gut-output.log
          if grep -E "SCRIPT ERROR:|ERROR:" gut-output.log; then
            exit 1
          fi
          grep -q "test_script_contracts.gd" gut-output.log

  windows-internal-build:
    name: Windows internal build artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.7.1 and export templates
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          rm -f godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64
          curl -L --fail -o export-templates.tpz https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.1.stable"
          unzip -q export-templates.tpz -d export-templates
          mv export-templates/templates/* "$HOME/.local/share/godot/export_templates/4.7.1.stable/"
          rm -rf export-templates export-templates.tpz

      - name: Export Windows internal validation build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/windows
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path . --export-release "Windows Desktop Internal Validation" build/windows/NinjaSurvivalInternal.exe
          test -s build/windows/NinjaSurvivalInternal.exe
          test -s build/windows/NinjaSurvivalInternal.pck

      - name: Upload Windows internal build
        uses: actions/upload-artifact@v4
        with:
          name: ninja-survival-windows-internal
          path: build/windows/
          if-no-files-found: error
          retention-days: 7
